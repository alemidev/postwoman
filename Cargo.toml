[package]
name = "postwoman"
description = "API tester and debugger for your CLI "
version = "0.5.2"
repository = "https://github.com/alemidev/postwoman"
authors = [ "alemi <me@alemi.dev>" ]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
dotenv = "0.15"
http = "1.4"
indexmap = { version = "2.14", features = ["serde"] }
jaq-interpret = "1.5"
jaq-parse = "1.0"
regex = "1.12"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] } # only to pretty print tables ...
uuid = { version = "1.23", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
